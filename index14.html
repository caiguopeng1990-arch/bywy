
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方导航与备用发布页</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between font-sans selection:bg-white selection:text-black">
    <!-- 头部 -->
    <header class="max-w-xl mx-auto px-6 pt-16 pb-8 text-center">
        <h1 class="text-2xl font-semibold tracking-tight mb-2">官方导航</h1>
        <p class="text-zinc-400 text-sm">请收藏本页，以防失联。所有链接均安全加密。</p>
    </header>
    <!-- 线路列表 -->
    <main class="max-w-xl mx-auto px-6 w-full flex-grow space-y-3">
        
        <!-- 主线路 -->
        <a href="https://yourdomain.com" target="_blank" rel="noopener noreferrer" 
           class="flex items-center justify-between p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition">
            <div>
                <div class="text-sm font-medium text-white">主线路 (Main)</div>
                <div class="text-xs text-zinc-400 mt-0.5">国内直连，推荐使用</div>
            </div>
            <span class="text-xs text-zinc-400 font-mono">访问 &rarr;</span>
        </a>
        <!-- 备用 1 -->
        <a href="https://backup1.yourdomain.com" target="_blank" rel="noopener noreferrer" 
           class="flex items-center justify-between p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition">
            <div>
                <div class="text-sm font-medium text-white">备用线路 1</div>
                <div class="text-xs text-zinc-400 mt-0.5">Cloudflare CDN 全球加速</div>
            </div>
            <span class="text-xs text-zinc-400 font-mono">访问 &rarr;</span>
        </a>
        <!-- 备用 2 -->
        <a href="https://backup2.yourdomain.com" target="_blank" rel="noopener noreferrer" 
           class="flex items-center justify-between p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition">
            <div>
                <div class="text-sm font-medium text-white">备用线路 2</div>
                <div class="text-xs text-zinc-400 mt-0.5">多地独立节点</div>
            </div>
            <span class="text-xs text-zinc-400 font-mono">访问 &rarr;</span>
        </a>
        <!-- 辅助联系 -->
        <div class="pt-4 border-t border-zinc-900 flex justify-between text-xs text-zinc-500 px-1">
            <a href="mailto:support@yourdomain.com" class="hover:text-zinc-300 transition">获取最新地址 (邮箱)</a>
            <a href="https://t.me/your_channel" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-300 transition">官方电报频道</a>
        </div>
    </main>
    <!-- 页脚 -->
    <footer class="max-w-xl mx-auto px-6 py-8 text-center text-zinc-600 text-xs">
        &copy; 2026 Navigation.
    </footer>
</body>
</html>
